services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    expose:
      - "8000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - panela_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Gateway de API: EC2 serve só o backend. Frontend vive em S3 + CloudFront.
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - panela_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/docs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  panela_net:
    driver: bridge
