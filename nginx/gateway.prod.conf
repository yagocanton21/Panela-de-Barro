server {
    listen 80 default_server;
    server_name _;
    add_header X-Nginx-Source "Panela-Barro-Gateway";

    resolver 127.0.0.11 valid=30s;

    # Gateway de API: a EC2 serve apenas o backend.
    # O frontend é entregue por S3 + CloudFront (HTTPS).

    # Backend API (FastAPI)
    location /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentação da API
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $http_host;
    }

    location /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_set_header Host $http_host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $http_host;
    }

    # Raiz: frontend não vive mais aqui (vai pro CloudFront)
    location = / {
        return 302 /docs;
    }
}
